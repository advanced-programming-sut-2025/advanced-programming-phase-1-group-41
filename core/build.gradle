
plugins {
  id 'application'
  id 'java'
}
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'


sourceSets.main.output.resourcesDir = file("${buildDir}/resources/main")

tasks.named('processResources') {
  into new File(buildDir, "resources/main")
}

tasks.named('compileJava') {
  destinationDirectory = file("$buildDir/classes/java/main")
}



dependencies {
  // Maven dependencies
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
  implementation 'ch.qos.logback:logback-classic:1.4.14'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.0'
//  implementation 'org.mongodb:mongodb-driver-sync:4.9.1'
  implementation 'dev.morphia.morphia:morphia-core:2.4.18'
  implementation 'org.mongodb:mongodb-driver-sync:4.10.2'
  implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
  // implementation 'org.jline:jline:3.23.0'

  // Your LibGDX-related dependencies

  implementation "com.badlogicgames.gdx:gdx-ai:1.8.2"
  implementation "org.java-websocket:Java-WebSocket:1.5.4"
  api "com.badlogicgames.box2dlights:box2dlights:$box2dlightsVersion"
  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.MrStahlfelge.gdx-websockets:core:$websocketVersion"
  api "com.github.tommyettinger:regexodus:$regExodusVersion"
  api "com.kotcrab.vis:vis-ui:$visUiVersion"
  api "com.rafaskoberg.gdx:typing-label:$typingLabelVersion"
  api "org.mini2Dx:universal-tween-engine:$universalTweenVersion"
  api "com.github.MrStahlfelge.gdx-websockets:core:$websocketVersion"
  implementation 'com.google.code.gson:gson:2.10.1'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  if (enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}



application {
  mainClass = 'com.CEliconValley.server.GameServer'
}

// Modern fat JAR configuration
tasks.register('serverJar', Jar) {
  archiveBaseName = 'server'
  archiveVersion = ''
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE

  manifest {
    attributes(
      'Main-Class': application.mainClass,
      'Class-Path': configurations.runtimeClasspath.files.collect { 'libs/' + it.name }.join(' ')
    )
  }

  from sourceSets.main.output

  from {
    configurations.runtimeClasspath.filter { it.name.endsWith('jar') }.collect {
      zipTree(it).matching {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
      }
    }
  }
}

// Configure dependency copying
tasks.register('copyRuntimeLibs', Copy) {
  from configurations.runtimeClasspath
  into layout.buildDirectory.dir('libs')
}

// Configure proper task dependencies
tasks.named('jar').configure {
  dependsOn tasks.named('copyRuntimeLibs')
  mustRunAfter tasks.named('copyRuntimeLibs')
}

tasks.named('distZip').configure {
  dependsOn tasks.named('copyRuntimeLibs')
  mustRunAfter tasks.named('copyRuntimeLibs')
}

tasks.named('distTar').configure {
  dependsOn tasks.named('copyRuntimeLibs')
  mustRunAfter tasks.named('copyRuntimeLibs')
}

tasks.named('startScripts').configure {
  dependsOn tasks.named('copyRuntimeLibs')
  mustRunAfter tasks.named('copyRuntimeLibs')
}

// Make build depend on our custom JAR
tasks.named('build') {
  dependsOn tasks.named('serverJar')
}
